name: Release

# Builds every download for one version and puts them on a DRAFT release.
# Nothing is public until you press Publish on the draft.
#
# Run it by hand: Actions > Release > Run workflow. The version comes from the
# files in the repo (they must all agree), and the release is tagged v<version>.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Check versions and create the draft
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure every version number agrees
        id: v
        run: |
          set -euo pipefail
          V1=$(node -p "require('./frontend/package.json').version")
          V2=$(node -p "require('./src-tauri/tauri.conf.json').version")
          V3=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "frontend/package.json: $V1"
          echo "src-tauri/tauri.conf.json: $V2"
          echo "src-tauri/Cargo.toml: $V3"
          if [ "$V1" != "$V2" ] || [ "$V1" != "$V3" ]; then
            echo "::error::The three version numbers do not match."
            exit 1
          fi
          echo "version=$V1" >> "$GITHUB_OUTPUT"

      - name: Stop if this version already has a release
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::A release for v${{ steps.v.outputs.version }} already exists. Raise the version first."
            exit 1
          fi

      - name: Create the draft release
        run: |
          cat > notes.md <<'NOTES'
          Script Writing in a way you know. Open source and free peer-to-peer.

          ## Downloads

          | System | File |
          |---|---|
          | Linux (Debian, Ubuntu, Kubuntu, Mint) | `.deb` |
          | Linux (Fedora, openSUSE) | `.rpm` |
          | Linux (any distribution) | `.AppImage` or `.tar.gz` |
          | macOS (Intel and Apple Silicon) | `.dmg` |
          | Windows (installer) | `-setup.exe` or `.msi` |
          | Windows (no install) | `portable.zip` |

          Check any file against `SHA256SUMS.txt`.

          ## First open on macOS and Windows

          These builds are not signed yet, so each system asks once.

          - macOS: right-click DraftCraft, choose Open, then Open again.
          - Windows: on the blue SmartScreen screen choose More info, then Run anyway.
          NOTES
          gh release create "v${{ steps.v.outputs.version }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "DraftCraft ${{ steps.v.outputs.version }}" \
            --notes-file notes.md

  linux:
    name: Linux (x64)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev pkg-config \
            patchelf squashfs-tools file

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build the .deb, .rpm and .AppImage
        run: ./frontend/node_modules/.bin/tauri build --bundles deb,rpm,appimage

      - name: Make the helper scripts runnable
        run: chmod +x .github/scripts/*

      - name: Remove the bundled Wayland libraries from the AppImage
        run: ./.github/scripts/fix-appimage-wayland.sh

      - name: Check the AppImage
        run: ./.github/scripts/verify-appimage-wayland.sh

      - name: Make the .tar.gz
        run: |
          set -euo pipefail
          STAGE="DraftCraft_${VERSION}_linux_x64"
          mkdir "$STAGE"
          cp src-tauri/target/release/draftcraft "$STAGE/draftcraft"
          cp LICENSE "$STAGE/LICENSE"
          cp src-tauri/linux/draftcraft.desktop "$STAGE/draftcraft.desktop"
          tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload to the draft
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            "DraftCraft_${VERSION}_linux_x64.tar.gz"

  macos:
    name: macOS (universal)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # "-" signs the app with a free ad-hoc signature, which Apple Silicon
      # needs before it will open an app at all. It is not a Developer ID.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build the universal .dmg
        run: ./frontend/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload to the draft
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --clobber \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build the .msi and the setup .exe
        run: ./frontend/node_modules/.bin/tauri build --bundles msi,nsis

      - name: Make the portable .zip
        shell: pwsh
        run: |
          $stage = "DraftCraft_${env:VERSION}_x64_portable"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item src-tauri\target\release\draftcraft.exe "$stage\DraftCraft.exe"
          Copy-Item LICENSE "$stage\LICENSE"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload to the draft
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --clobber \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            "DraftCraft_${VERSION}_x64_portable.zip"

  checksums:
    name: Checksums
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Write SHA256SUMS.txt for every file on the draft
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "v$VERSION" --dir assets
          cd assets
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          cd ..
          gh release upload "v$VERSION" --clobber SHA256SUMS.txt
