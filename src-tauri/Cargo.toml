[package]
name = "draftcraft"
version = "0.0.42"
description = "DraftCraft - Professional Screenwriting Application"
authors = ["maximumrob"]
edition = "2021"

[lib]
name = "draftcraft_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
# The Tauri crates are pinned to exact versions so that a transitive update
# cannot change how the web view behaves.
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
# Opening a URL in the system browser, so external links go through the
# platform instead of window.open().
tauri-plugin-opener = "=2.5.2"
# Reading the clipboard through the platform, because the web view's own
# clipboard API can refuse permission.
tauri-plugin-clipboard-manager = "=2.3.3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
percent-encoding = "2"
# Live co-editing sessions (src/live): direct connections, with a relay fallback (IPs are shared with the relay; the document stays end-to-end encrypted).
iroh = "=1.3.0"
tokio = { version = "1", features = ["sync", "time", "rt"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# Keep symbols so that crash reports can be symbolicated.
strip = false
debug = "line-tables-only"
